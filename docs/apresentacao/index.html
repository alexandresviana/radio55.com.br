<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Orbit View — apresentação</title>
  <style>
    :root {
      --ink: #0f172a;
      --muted: #475569;
      --line: #e2e8f0;
      --paper: #f8fafc;
      --green: #047857;
      --green-2: #065f46;
      --amber: #d97706;
      --white: #ffffff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #020617; color: var(--ink); font-family: "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif; }
    button, .ui { font-family: ui-sans-serif, system-ui, sans-serif; }
    .deck { height: 100%; display: grid; place-items: center; padding: 24px; }
    .slide {
      display: none;
      width: min(1080px, 100%);
      min-height: min(640px, calc(100vh - 96px));
      background: var(--paper);
      border-radius: 28px;
      padding: 56px 64px;
      position: relative;
      box-shadow: 0 30px 80px rgba(0,0,0,.35);
      overflow: hidden;
    }
    .slide.on { display: flex; flex-direction: column; }
    .slide.dark {
      background: linear-gradient(145deg, #020617 0%, #064e3b 55%, #0f172a 100%);
      color: white;
    }
    .kicker {
      margin: 0 0 12px;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--green);
      font-weight: 700;
    }
    .dark .kicker { color: #6ee7b7; }
    h1 { font-size: clamp(40px, 5vw, 68px); line-height: .95; margin: 0; font-weight: 700; letter-spacing: -.03em; }
    h2 { font-size: clamp(32px, 4vw, 48px); line-height: 1.05; margin: 0 0 18px; letter-spacing: -.03em; }
    p.lead { font-size: 22px; line-height: 1.45; color: var(--muted); max-width: 38rem; }
    .dark p.lead { color: #d1fae5; }
    ul { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 12px; }
    li {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 18px;
      line-height: 1.4;
      padding-left: 18px;
      position: relative;
    }
    li::before {
      content: "";
      width: 8px; height: 8px; border-radius: 99px;
      background: var(--amber);
      position: absolute; left: 0; top: .55em;
    }
    .dark li { color: #ecfdf5; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px 18px 16px;
    }
    .dark .card { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); }
    .card strong {
      display: block;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 15px;
      margin-bottom: 6px;
    }
    .card span { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; color: var(--muted); line-height: 1.4; }
    .dark .card span { color: #cbd5e1; }
    .bar {
      position: absolute; left: 64px; right: 64px; bottom: 28px;
      display: flex; justify-content: space-between; align-items: center;
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 12px; letter-spacing: .08em; text-transform: uppercase;
      color: #94a3b8;
    }
    .controls {
      position: fixed; right: 22px; bottom: 18px; display: flex; gap: 8px; z-index: 3;
    }
    .controls button, .langs button {
      border: 0; border-radius: 999px; padding: 10px 14px; cursor: pointer;
      background: white; color: var(--ink); font-weight: 650;
    }
    .langs {
      position: fixed; left: 22px; top: 18px; display: flex; gap: 6px; z-index: 3;
    }
    .langs button.on { background: var(--green); color: white; }
    .hint { position: fixed; left: 22px; bottom: 18px; color: #94a3b8; font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; }
    @media (max-width: 800px) {
      .slide { padding: 32px 24px 64px; min-height: calc(100vh - 48px); }
      .grid { grid-template-columns: 1fr; }
      .bar { left: 24px; right: 24px; }
    }
  </style>
</head>
<body>
  <div class="langs ui">
    <button type="button" id="btn-pt" class="on">Português</button>
    <button type="button" id="btn-es">Español</button>
  </div>
  <div class="deck" id="deck"></div>
  <p class="hint ui" id="hint"></p>
  <div class="controls ui">
    <button type="button" id="prev">←</button>
    <button type="button" id="next">→</button>
  </div>
  <script>
    const copy = {
      pt: {
        hint: "Setas do teclado · clique nas bordas",
        slides: [
          { dark: true, kicker: "Orbit View", title: "O que a mídia regional está dizendo.", lead: "Sala de controle para rádio, YouTube, Instagram, X, anúncios e notícias — com mapa, transcrição e busca em linguagem natural." },
          { kicker: "Para quem", title: "Uma ferramenta de operação, não um player.", lead: "Assessoria, redação, equipe política e pesquisa de mídia. Quem precisa de evidência do que foi dito, sem ouvir tudo ao vivo.", items: ["Acesso restrito, com login", "Bahia, Sergipe e Alagoas no mapa", "Um painel só para várias fontes"] },
          { kicker: "Panorama", title: "O que está rolando, num relance.", items: ["Filtro por assunto e período: 24 horas, 7 dias ou 30 dias", "Relatório de IA com tom, destaques e alertas", "Gráfico de menções por veículo — e, ao clicar, por fonte", "Lista com trecho, áudio e link da origem"] },
          { kicker: "Rádio", title: "Do mapa ao trecho de áudio.", items: ["Mapa por município e região, com a rádio ao vivo", "Gravação contínua das emissoras marcadas, com faixa de horário", "Transcrição automática e busca livre no texto", "Alerta de palavra-chave com clipe e ponto exato no MP3"] },
          { kicker: "YouTube", title: "O que os canais locais falaram.", items: ["Cadastro de canais monitorados", "Legendas e transcrição, sem baixar o vídeo", "Detecção dos assuntos e busca nas legendas", "Fila, estreias e reprocessamento no admin"] },
          { kicker: "Instagram e X", title: "O que circula nas redes.", items: ["Perfis públicos e coleta periódica das publicações", "Comentários analisados junto com a legenda", "Busca por hashtag quando o assunto marca Coletar IG ou Coletar X", "Posts e detecções na página inicial"] },
          { kicker: "Anúncios e web", title: "Quem está pagando para falar, e o que os portais publicaram.", items: ["Biblioteca de anúncios da Meta, por termo ou por página", "Portais e feeds de notícia", "As mesmas palavras-chave atravessam anúncio e matéria", "Detecção com link de volta à origem"] },
          { kicker: "Busca com IA", title: "Pergunte como falaria com um analista.", lead: "“O que falaram do governador na rádio X ontem de manhã?” A busca interpreta a pergunta, vasculha transcrições e responde com as fontes citadas.", items: ["Rádio e YouTube no mesmo resultado", "Filtros de data, horário, emissora e município", "Trecho com link para o MP3 ou para o vídeo"] },
          { kicker: "Assuntos", title: "Uma palavra, todas as fontes.", items: ["Pessoa — candidato, oponente ou aliado — vale sozinha", "Tema só conta quando aparece junto de alguém daquele papel", "Cada assunto liga ou desliga a coleta em Instagram, X, anúncios e web", "Rádio e YouTube entram na detecção de qualquer assunto ativo"] },
          { dark: true, kicker: "Orbit View", title: "Três idiomas. A mesma sala de controle.", lead: "No login, Português, Español ou English. A escolha vale para a interface, o relatório e a resposta da busca.", items: ["Panorama, mapa, admin e alertas", "Relatório de IA no idioma escolhido", "Pergunta em linguagem natural, respondida no mesmo idioma"] }
        ]
      },
      es: {
        hint: "Flechas del teclado · clic en los bordes",
        slides: [
          { dark: true, kicker: "Orbit View", title: "Lo que están diciendo los medios regionales.", lead: "Sala de control para radio, YouTube, Instagram, X, anuncios y noticias — con mapa, transcripción y búsqueda en lenguaje natural." },
          { kicker: "Para quién", title: "Una herramienta de operación, no un reproductor.", lead: "Asesoría, redacción, equipo político e investigación de medios. Quien necesita evidencia de lo que se dijo, sin escuchar todo en vivo.", items: ["Acceso restringido, con inicio de sesión", "Bahía, Sergipe y Alagoas en el mapa", "Un solo panel para varias fuentes"] },
          { kicker: "Panorama", title: "Qué está pasando, de un vistazo.", items: ["Filtro por tema y período: 24 horas, 7 días o 30 días", "Informe de IA con tono, destacados y alertas", "Gráfico de menciones por vehículo y, al hacer clic, por fuente", "Lista con fragmento, audio y enlace al origen"] },
          { kicker: "Radio", title: "Del mapa al fragmento de audio.", items: ["Mapa por municipio y región, con la radio en vivo", "Grabación continua de las emisoras marcadas, con franja horaria", "Transcripción automática y búsqueda libre en el texto", "Alerta de palabra clave con clip y punto exacto en el MP3"] },
          { kicker: "YouTube", title: "Lo que dijeron los canales locales.", items: ["Registro de canales monitoreados", "Subtítulos y transcripción, sin descargar el video", "Detección de temas y búsqueda en los subtítulos", "Cola, estrenos y reproceso en el admin"] },
          { kicker: "Instagram y X", title: "Lo que circula en las redes.", items: ["Perfiles públicos y recolección periódica de publicaciones", "Comentarios analizados junto con el pie de foto", "Búsqueda por hashtag cuando el tema marca Recopilar IG o Recopilar X", "Publicaciones y detecciones en la página inicial"] },
          { kicker: "Anuncios y web", title: "Quién paga por hablar, y qué publicaron los portales.", items: ["Biblioteca de anuncios de Meta, por término o por página", "Portales y feeds de noticias", "Las mismas palabras clave cruzan anuncio y nota", "Detección con enlace de vuelta al origen"] },
          { kicker: "Búsqueda con IA", title: "Pregunte como le hablaría a un analista.", lead: "“¿Qué dijeron del gobernador en la radio X ayer por la mañana?” La búsqueda interpreta la pregunta, revisa transcripciones y responde con las fuentes citadas.", items: ["Radio y YouTube en el mismo resultado", "Filtros de fecha, horario, emisora y municipio", "Fragmento con enlace al MP3 o al video"] },
          { kicker: "Temas", title: "Una palabra, todas las fuentes.", items: ["Una persona — candidato, oponente o aliado — vale por sí sola", "Un tema solo cuenta cuando aparece junto a alguien de ese rol", "Cada tema enciende o apaga la recolección en Instagram, X, anuncios y web", "Radio y YouTube entran en la detección de cualquier tema activo"] },
          { dark: true, kicker: "Orbit View", title: "Tres idiomas. La misma sala de control.", lead: "Al entrar: Português, Español o English. La elección vale para la interfaz, el informe y la respuesta de la búsqueda.", items: ["Panorama, mapa, admin y alertas", "Informe de IA en el idioma elegido", "Pregunta en lenguaje natural, respondida en el mismo idioma"] }
        ]
      }
    };

    let lang = "pt";
    let index = 0;

    function render() {
      const pack = copy[lang];
      const deck = document.getElementById("deck");
      deck.innerHTML = pack.slides.map((slide, i) => {
        const items = (slide.items || []).map((item) => `<li>${item}</li>`).join("");
        const cards = items ? `<ul>${items}</ul>` : "";
        const lead = slide.lead ? `<p class="lead">${slide.lead}</p>` : "";
        return `<section class="slide${slide.dark ? " dark" : ""}${i === index ? " on" : ""}">
          <p class="kicker">${slide.kicker}</p>
          ${i === 0 || i === pack.slides.length - 1
            ? `<h1>${slide.title}</h1>`
            : `<h2>${slide.title}</h2>`}
          ${lead}
          ${cards}
          <div class="bar"><span>Orbit View</span><span>${i + 1} / ${pack.slides.length}</span></div>
        </section>`;
      }).join("");
      document.getElementById("hint").textContent = pack.hint;
      document.documentElement.lang = lang === "es" ? "es" : "pt-BR";
      document.getElementById("btn-pt").classList.toggle("on", lang === "pt");
      document.getElementById("btn-es").classList.toggle("on", lang === "es");
    }

    function go(delta) {
      const total = copy[lang].slides.length;
      index = (index + delta + total) % total;
      render();
    }

    document.getElementById("prev").onclick = () => go(-1);
    document.getElementById("next").onclick = () => go(1);
    document.getElementById("btn-pt").onclick = () => { lang = "pt"; render(); };
    document.getElementById("btn-es").onclick = () => { lang = "es"; render(); };
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight" || event.key === " ") go(1);
      if (event.key === "ArrowLeft") go(-1);
    });
    render();
  </script>
</body>
</html>
